name: Build & Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-build:
    runs-on: self-hosted
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest@sha256:0f9811b3b5145364a678ff4d6e8f04ed18e7ffd1784e936f72e7f5d416bb6677

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - name: Setup Attic
        id: attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_KEY }}
          ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
          ATTIC_STORE: ${{ vars.ATTIC_STORE }}
        run: |
          nix shell nixpkgs#attic-client -c sh -c '
            attic login "$ATTIC_STORE" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
            attic use "$ATTIC_STORE"
          '

      - name: Build & Checks
        run: |
          nix flake check . -L --no-update-lock-file

      - name: Push to Attic
        if: always()
        env:
          ATTIC_STORE: ${{ vars.ATTIC_STORE }}
        run: |
          nix shell nixpkgs#attic-client -c sh -c '
            attic push "$ATTIC_STORE" --ignore-upstream-cache-filter -j 64 $(ls -d /nix/store/*/)
          '
