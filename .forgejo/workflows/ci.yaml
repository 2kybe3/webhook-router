name: Build & Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-build:
    runs-on: self-hosted
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest@sha256:a69bc68d691e9e9afd294dbb9ea7a71e38207c2f0a7b689b5dc6a4cacf06f5e6

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://git.kybe.xyz/2kybe3/ci/actions/nix-setup@main
      - uses: https://git.kybe.xyz/2kybe3/ci/actions/attic-setup@main
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build & Checks
        run: |
          nix flake check . -L --no-update-lock-file

      - uses: https://git.kybe.xyz/2kybe3/ci/actions/attic-push@main
